server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gamebox?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456

  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: status
      logic-delete-value: 0
      logic-not-delete-value: 1

# JWT 配置
jwt:
  secret: gamebox-jwt-secret-key-2026-must-be-at-least-256-bits-long-for-hs256
  expiration: 604800000  # 7 天 (毫秒)

logging:
  level:
    com.gamebox: debug
